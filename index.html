<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Pigs</title>
<style>
  :root{
    --cream:#f6edd6; --card:#fffdf6; --ink:#5b4636; --ink2:#93795c;
    --line:#d9c399; --barn:#c85b52; --barn2:#a8443d;
    --gold:#e8b23a; --gold2:#c98f22; --bad:#c85b52; --good:#4a9e6b;
    --spring:#6bbf5e; --summer:#e6b53a; --autumn:#e0873a; --winter:#7fb8e0;
    --p0:#d6588a; --p1:#2f9e7d; --p2:#d08a2e;
    --cell:17px;
    --shadow:0 6px 0 rgba(120,90,55,.18),0 10px 24px -10px rgba(90,60,30,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{color:var(--ink);font:15px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(900px 400px at 20% 0%, rgba(255,255,220,.5), transparent),
      linear-gradient(180deg,#d9e97e,#abd14e 55%,#9cc843);}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;
    background:linear-gradient(180deg,#93cc41,#7ab536);box-shadow:0 4px 0 rgba(80,120,30,.35)}
  header h1{font-size:24px;margin:0;color:#d23f8e;letter-spacing:.5px;font-weight:900;
    text-shadow:-2px 0 #fff,2px 0 #fff,0 -2px #fff,0 2px #fff,-2px -2px #fff,2px 2px #fff,-2px 2px #fff,2px -2px #fff,0 4px 0 rgba(90,50,20,.25)}
  .season-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
    background:#fff6e6;border:2px solid rgba(120,60,45,.25);font-weight:800;color:var(--ink)}
  .season-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px #fff inset}
  .spacer{flex:1}
  .hdr-stat{color:#33590f;font-size:14px;font-weight:700}
  .hdr-stat b{color:#1c3a06}

  main{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 20px;overflow:auto}
  .board{display:grid;grid-template-columns:1fr;gap:12px}
  .player{background:#fffef8;border:3px solid #a34d75;border-radius:18px;padding:12px 16px;
    border-left:8px solid var(--line);box-shadow:0 5px 0 rgba(90,50,70,.22),0 10px 24px -10px rgba(60,40,20,.4);
    transition:box-shadow .3s,transform .2s,opacity .3s}
  .player.active{box-shadow:0 0 0 3px var(--gold),var(--shadow);transform:translateY(-1px)}
  body.picking .player:not(.active){opacity:.6;filter:saturate(.7)}
  .p-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .p-name{font-weight:900;font-size:18px}
  .p-name .marker{font-size:12px;color:var(--gold2);margin-left:6px;font-weight:800}
  .p-name .bot{font-size:11px;color:var(--ink2);margin-left:6px;font-weight:600}
  .coins{color:#2f5138;font-weight:900;font-size:19px;background:linear-gradient(180deg,#e3ecd6,#c3d4b6);
    padding:6px 20px;border-radius:4px;border:1.5px solid #9db38c;position:relative;
    box-shadow:1.5px 1.5px 0 #b9c9a8,3px 3px 0 rgba(120,140,100,.45);letter-spacing:.5px}
  .coins::before{content:"";position:absolute;inset:3px;border:1px dashed #8ba677;border-radius:2px;pointer-events:none}
  .p-meta{color:#b09a7d;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;font-weight:600;margin-bottom:8px}
  .p-meta .k{color:var(--ink2);font-weight:800}

  /* field boards: 8×4, dashed grid + fence posts, like the real boards */
  .fields{display:flex;justify-content:center;padding:6px 10px 22px}
  .pasture{position:relative;overflow:visible}
  .pasture.multi .fieldboard{cursor:grab}
  .fieldboard.fdrag{cursor:grabbing;opacity:.9;box-shadow:0 0 0 3px var(--gold),0 6px 16px rgba(40,60,20,.45)}
  .pigs-layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .fieldboard{position:absolute;width:calc(var(--cell)*16 + 8px);height:calc(var(--cell)*8 + 8px);
    border-radius:8px;border:4px solid #f2ecd2;
    background:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"><path d="M16.5 0 V34 M0 16.5 H34" stroke="%234c8a28" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.3"/><path d="M33.5 0 V34 M0 33.5 H34" stroke="%234c8a28" stroke-width="1.4" stroke-dasharray="4 3" fill="none" opacity="0.55"/></svg>') repeat,
      linear-gradient(180deg,#bede63,#a3cf49);
    background-origin:content-box;background-clip:content-box;
    box-shadow:0 3px 0 rgba(80,120,40,.35),inset 0 2px 8px rgba(90,140,40,.25)}
  .fieldboard::after{content:"";position:absolute;left:4px;right:4px;bottom:-11px;height:9px;
    border-top:2px solid #8a5a33;
    background:repeating-linear-gradient(90deg,transparent 0 30px,#8a5a33 30px 35px);opacity:.75}
  .pigtile{position:absolute;border-radius:6px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 2px 3px rgba(60,90,30,.45);pointer-events:auto;
    transition:transform .15s;cursor:grab;z-index:1;touch-action:none}
  .pigtile img.pigart{width:100%;height:100%;object-fit:fill;display:block;-webkit-user-drag:none}
  .pigtile.dragging{transition:none;cursor:grabbing;opacity:.85}
  .dragghost{position:absolute;border:3px dashed #fff;border-radius:6px;z-index:4;pointer-events:none}
  .dragghost.boardghost{border-width:4px;border-radius:8px}
  .dragghost.ok{border-color:#fff;background:rgba(255,255,255,.35)}
  .dragghost.bad{border-color:#d33;background:rgba(220,60,60,.3)}
  .pigtile.pick{cursor:pointer;box-shadow:0 0 0 3px var(--gold),0 2px 3px rgba(60,90,30,.4)}
  .pigtile.pick:hover{transform:scale(1.07);z-index:3}
  .pigtile.sel{border-color:#fff;box-shadow:0 0 0 3px var(--barn),0 2px 3px rgba(60,90,30,.4);z-index:3}
  .pigtile.dim{opacity:.4;filter:grayscale(.7);pointer-events:none}
  .pigtile.born{animation:born .5s cubic-bezier(.2,1.4,.4,1)}
  .pigtile.grew{animation:grew .5s ease}
  .pigtile.dying{animation:dying .7s ease forwards}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes born{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes grew{0%{transform:scale(1)}45%{transform:scale(1.4)}100%{transform:scale(1)}}
  @keyframes dying{0%{opacity:1}30%{transform:translateY(-5px) rotate(-8deg)}100%{transform:translateY(30px) rotate(20deg);opacity:0}}

  /* season card */
  .scard{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#ffe9a8,#ffd257);
    border:3px solid #d99a2b;border-radius:14px;padding:8px 14px;margin-bottom:10px;
    box-shadow:0 3px 0 rgba(160,110,20,.35)}
  .scard .sico{font-size:30px}
  .scard .qty{display:flex;gap:8px;flex-wrap:wrap}
  .scard .q{font-weight:900;font-size:14px;padding:4px 10px;border-radius:10px;border:2px solid var(--line)}
  .scard .eff{font-size:12px;color:var(--ink2);font-weight:700;flex:1;text-align:right}

  .controls{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
  .prompt{font-size:16px;color:var(--ink);margin-bottom:12px;min-height:20px;font-weight:700}
  .prompt b{color:var(--barn2)}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 8px;
    border:2px solid var(--line);border-radius:14px;cursor:pointer;transition:transform .12s,box-shadow .2s;
    user-select:none;box-shadow:0 3px 0 rgba(150,120,70,.3)}
  .tile:hover:not(.off){transform:translateY(-3px);box-shadow:0 6px 0 rgba(150,120,70,.3)}
  .tile.off{opacity:.4;cursor:not-allowed;box-shadow:none;filter:grayscale(.5)}
  .tile .ico{font-size:32px}.tile .t{font-weight:900;font-size:16px}.tile .d{font-size:11px;opacity:.75;text-align:center;font-weight:600}
  .tile .atile{width:64px;height:64px;border-radius:12px;box-shadow:0 2px 4px rgba(120,80,20,.4);-webkit-user-drag:none}
  .rv .card .atile{width:66px;height:66px;border-radius:12px;box-shadow:0 2px 4px rgba(120,80,20,.4);-webkit-user-drag:none}
  .q .qi{width:20px;height:20px;border-radius:5px;vertical-align:-5px;margin-right:1px}
  /* action tiles are orange-yellow in the real game */
  .tile.k-feed,.tile.k-mate,.tile.k-buy,.tile.k-sell,.tile.k-none,
  .rv .card.k-feed,.rv .card.k-mate,.rv .card.k-buy,.rv .card.k-sell,.rv .card.k-none,
  .q.k-feed,.q.k-mate,.q.k-buy,.q.k-sell{
    background:linear-gradient(180deg,#ffd94f,#f2a72e);border-color:#cd8a1f;color:#6b4308}
  .submenu{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .btn{padding:10px 16px;border-radius:12px;border:2px solid var(--line);
    background:linear-gradient(180deg,#fffdf7,#f2e6c9);color:var(--ink);cursor:pointer;font-size:14px;
    font-weight:800;transition:.15s;box-shadow:0 3px 0 rgba(150,120,70,.3);font-family:inherit}
  .btn:hover:not(:disabled){transform:translateY(-2px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
  .btn.big{padding:13px 28px;font-size:17px}
  .btn.primary{background:linear-gradient(180deg,#d64f92,#b83a78);border-color:#9c2f65;
    color:#fff;box-shadow:0 4px 0 rgba(120,40,80,.5)}
  .btn .c{color:var(--gold2)}
  .btn.it-piglet,.btn.it-small,.btn.it-average,.btn.it-big{background:linear-gradient(180deg,#b8e08a,#9ccf66);border-color:#7fb44a;color:#2f5814}
  .btn.it-vaccine{background:linear-gradient(180deg,#8ed4e8,#5fb9d6);border-color:#3f9cba;color:#0e4658}
  .btn.it-supplement{background:linear-gradient(180deg,#c9a8e8,#ab84d4);border-color:#8a63b6;color:#3c1f60}
  .btn.it-amulet{background:linear-gradient(180deg,#f0a0c8,#dd7bae);border-color:#c05a92;color:#5c1038}
  .btn.it-field{background:linear-gradient(180deg,#e8d8b0,#d4bc82);border-color:#b39a5e;color:#4d3c12}
  .btn.it-piglet .c,.btn.it-vaccine .c,.btn.it-supplement .c,.btn.it-amulet .c,.btn.it-field .c,
  .btn.it-small .c,.btn.it-average .c,.btn.it-big .c{color:inherit;opacity:.75}

  .reveal{display:flex;gap:26px;justify-content:center;align-items:center;padding:8px 0;flex-wrap:wrap}
  .rv{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:100px}
  .rv .who{font-size:13px;font-weight:800}
  .rv .card{width:98px;height:118px;border-radius:16px;border:3px solid var(--line);
    background:linear-gradient(180deg,#fffdf7,#f2e6c9);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;animation:flip .5s ease;box-shadow:var(--shadow)}
  .rv .card .ico{font-size:42px}.rv .card .t{font-weight:900}
  .rv .n{font-size:12px;font-weight:800;color:var(--ink2)}
  @keyframes flip{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}

  .log{background:#fbf3dd;border:1px solid #e6d6ae;border-radius:14px;padding:8px 14px;font-size:12px;
    max-height:104px;overflow:auto}
  .log div{padding:3px 0;border-bottom:1px solid #efe3c4;font-weight:600;opacity:.55}
  .log div:first-child{opacity:1;font-size:13px}
  .log div:nth-child(2){opacity:.75}
  .log div:last-child{border:0}
  .log .p0{color:var(--p0)}.log .p1{color:var(--p1)}.log .p2{color:var(--p2)}
  .log .sys{color:var(--gold2)}.log .die{color:var(--bad)}

  .float{position:fixed;pointer-events:none;font-weight:900;font-size:20px;z-index:50;animation:floatup 1s ease forwards;
    text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .float.plus{color:var(--gold2)}.float.minus{color:var(--bad)}
  @keyframes floatup{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-42px)}}

  .overlay{position:fixed;inset:0;background:rgba(70,45,28,.72);display:flex;align-items:center;justify-content:center;
    z-index:100;animation:fade .3s ease;padding:16px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fffef8;border:3px solid #a34d75;border-radius:22px;padding:28px 34px;max-width:600px;
    width:100%;text-align:center;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
  .modal h2{margin:.2em 0;color:var(--ink)}
  .modal .big-ico{font-size:64px}
  .modal p{color:var(--ink2);font-weight:600}
  .final-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:2px solid #ecdfc0;font-weight:700}
  .final-row b{color:var(--gold2)}
  /* market strip: prices with real tile thumbnails, rules line muted below */
  .market{background:#fffef8;border:2px solid #b98b5e;border-radius:12px;padding:7px 14px;
    text-align:center;font-size:12px;font-weight:700;color:var(--ink);
    box-shadow:0 3px 0 rgba(120,90,50,.3)}
  .market .mrow{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
  .market .mrow.rules{font-size:10.5px;color:#8a7458;font-weight:600;margin-top:3px;gap:8px}
  .market .mitem{display:inline-flex;align-items:center;gap:4px}
  .market .c{color:var(--gold2)}
  .thumb{width:20px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle}
  .thumb.wide{width:28px}
  .scare{height:17px;border-radius:3px;vertical-align:-3px}
  .controls,.log{position:relative}
  .controls{background:#fffef8;border:3px solid #a34d75}
  .log{background:#f4f0d8;border:2px solid #c9bd8d}
  .seatcount{display:flex;gap:10px;justify-content:center;margin:16px 0}
  .seat{display:flex;align-items:center;gap:10px;justify-content:space-between;
    background:linear-gradient(180deg,#fffdf7,#f4e8cd);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:9px 0}
  .seat .dotc{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff}
  .seat input{flex:1;background:#fff9ea;border:2px solid var(--line);border-radius:10px;color:var(--ink);
    padding:9px 11px;font-size:14px;font-weight:700;font-family:inherit}
  .seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:#fff9ea;border:0;color:var(--ink2);padding:9px 14px;cursor:pointer;font-size:13px;font-weight:800;font-family:inherit}
  .seg button.on{background:linear-gradient(180deg,var(--barn),var(--barn2));color:#fff5e6}
  .pass-name{font-size:30px;font-weight:900;margin:8px 0}
  .vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #efe3c4}
</style>
</head>
<body>
<header>
  <h1>🐷 Happy Pigs</h1>
  <div class="season-chip"><span class="season-dot" id="seasonDot"></span><span id="seasonName">Spring</span></div>
  <div class="hdr-stat">Card <b id="roundNo">1</b>/4</div>
  <div class="spacer"></div>
  <div class="hdr-stat" id="startTxt"></div>
</header>

<main>
  <div class="board" id="board"></div>
  <div class="controls">
    <div id="scardBox"></div>
    <div class="prompt" id="prompt">Setting up…</div>
    <div class="tiles" id="tiles"></div>
    <div class="submenu" id="submenu"></div>
  </div>
  <div class="log" id="log"></div>
  <div class="market" id="noteLine"></div>
</main>

let uid=0;
let players=[], nP=2;
const state={season:0,round:1,startIdx:0,card:null,roundSerial:0};

function mkPlayer(name,human){
  return {name,human,coins:45,fields:[{bx:0,by:0}],pigs:[],items:{vaccine:0,supplement:0,amulet:0},soldThisRound:0};
}
function mkPig(size){return {id:++uid,size,vacc:false,x:0,y:0,fedRound:-1,matedRound:-1}}

/* ===== placement: field boards live on one shared fine grid; pigs use global
   (x,y) cells and may straddle any seam between adjacent boards ===== */
/* pasture = bounding box of all boards + which global cells are farmable */
function pasture(p){
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  for(const b of p.fields){ if(b.bx<minx)minx=b.bx; if(b.by<miny)miny=b.by;
    if(b.bx+FW>maxx)maxx=b.bx+FW; if(b.by+FH>maxy)maxy=b.by+FH; }
  const W=maxx-minx, H=maxy-miny;
  const farm=Array.from({length:H},()=>Array(W).fill(false));
  for(const b of p.fields) for(let y=0;y<FH;y++)for(let x=0;x<FW;x++) farm[b.by-miny+y][b.bx-minx+x]=true;
  return {minx,miny,W,H,farm};
}
/* keep the top-left board at (0,0); shift pigs with it so coords stay non-negative */
function normalize(p){
  let minx=Infinity,miny=Infinity;
  for(const b of p.fields){ if(b.bx<minx)minx=b.bx; if(b.by<miny)miny=b.by; }
  if(!isFinite(minx)||(!minx&&!miny)) return;
  for(const b of p.fields){ b.bx-=minx; b.by-=miny; }
  for(const pg of p.pigs){ pg.x-=minx; pg.y-=miny; }
}
function addField(p){
  let maxx=0; for(const b of p.fields) maxx=Math.max(maxx,b.bx+FW);
  p.fields.push({bx:maxx,by:0}); normalize(p);
}
function occGrid(p,ignoreId){
  const {W,H}=pasture(p);
  const g=Array.from({length:H},()=>Array(W).fill(false));
  for(const pg of p.pigs){ if(pg.id===ignoreId) continue;
    const [w,h]=SPAN[pg.size];
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){ const yy=pg.y+dy,xx=pg.x+dx;
      if(yy>=0&&yy<H&&xx>=0&&xx<W) g[yy][xx]=true; }}
  return g;
}
/* a pig fits at (x,y) iff every covered cell is farmable and unoccupied */
function canPlaceAt(p,x,y,size,ignoreId){
  const [w,h]=SPAN[size]; const {W,H,farm}=pasture(p);
  if(x<0||y<0||x+w>W||y+h>H) return false;
  const g=occGrid(p,ignoreId);
  for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){ if(!farm[y+dy][x+dx]||g[y+dy][x+dx]) return false; }
  return true;
}
function findSpot(p,size,ignoreId){
  const [w,h]=SPAN[size]; const {W,H,farm}=pasture(p); const g=occGrid(p,ignoreId);
  for(let y=0;y<=H-h;y++)for(let x=0;x<=W-w;x++){
    let ok=true;
    for(let dy=0;dy<h&&ok;dy++)for(let dx=0;dx<w&&ok;dx++){ if(!farm[y+dy][x+dx]||g[y+dy][x+dx]) ok=false; }
    if(ok) return {x,y};
  }
  return null;
}
/* greedy repack: place pigs largest-first onto the farmable region; positions or null */
function packAll(p,extraSizes,grow){
  const list=p.pigs.map(pg=>({id:pg.id,size:pg.id===(grow&&grow.id)?grow.size:pg.size}));
  (extraSizes||[]).forEach((s,k)=>list.push({id:'new'+k+'_'+Math.abs(uid+list.length),size:s,isNew:true}));
  const area=s=>SPAN[s][0]*SPAN[s][1];
  list.sort((a,b)=>area(b.size)-area(a.size));
  const {W,H,farm}=pasture(p);
  const used=Array.from({length:H},()=>Array(W).fill(false));
  const pos={};
  for(const it of list){
    const [w,h]=SPAN[it.size]; let placed=false;
    for(let y=0;y<=H-h&&!placed;y++)
      for(let x=0;x<=W-w&&!placed;x++){
        let ok=true;
        for(let dy=0;dy<h&&ok;dy++)for(let dx=0;dx<w&&ok;dx++){ if(!farm[y+dy][x+dx]||used[y+dy][x+dx]) ok=false; }
        if(ok){ for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++) used[y+dy][x+dx]=true;
          pos[it.id]={x,y}; placed=true; }
      }
    if(!placed) return null;
  }
  return pos;
}
function applyPack(p,pos){ p.pigs.forEach(pg=>{ const q=pos[pg.id]; if(q){pg.x=q.x;pg.y=q.y;} }); }
/* try to place a new pig: direct spot, else full repack */
function acquirePig(p,size){
  const spot=findSpot(p,size);
  if(spot){ const pg=mkPig(size); Object.assign(pg,spot); p.pigs.push(pg); return pg; }
  const pos=packAll(p,[size]);
  if(pos){ applyPack(p,pos); const nk=Object.keys(pos).find(k=>String(k).startsWith('new'));
    const pg=mkPig(size); Object.assign(pg,pos[nk]); p.pigs.push(pg); return pg; }
  return null;
}
function canFitNew(p,size){ return !!(findSpot(p,size)||packAll(p,[size])); }
/* grow a pig one step; keeps anchor if possible, else repack; false if impossible */
function growPig(p,pg){
  const ns=NEXT[pg.size]; if(!ns) return false;
  if(canPlaceAt(p,pg.x,pg.y,ns,pg.id)){ pg.size=ns; return true; }
  const spot=findSpot(p,ns,pg.id); if(spot){ pg.size=ns; Object.assign(pg,spot); return true; }
  const pos=packAll(p,null,{id:pg.id,size:ns});
  if(pos){ pg.size=ns; applyPack(p,pos); return true; }
  return false;
}
function canGrow(p,pg){ const ns=NEXT[pg.size]; if(!ns) return false;
  return canPlaceAt(p,pg.x,pg.y,ns,pg.id)||!!findSpot(p,ns,pg.id)||!!packAll(p,null,{id:pg.id,size:ns}); }
/* snapshot/restore board+pig coords, so a rejected board move can revert cleanly */
function snapPlay(p){ return {fields:p.fields.map(b=>({bx:b.bx,by:b.by})),
  pigs:p.pigs.map(pg=>({id:pg.id,x:pg.x,y:pg.y}))}; }
function restorePlay(p,s){ p.fields.forEach((b,i)=>{ b.bx=s.fields[i].bx; b.by=s.fields[i].by; });
  const m={}; s.pigs.forEach(q=>m[q.id]=q);
  p.pigs.forEach(pg=>{ const q=m[pg.id]; if(q){ pg.x=q.x; pg.y=q.y; } }); }

/* ===== season deck: per card, shared quantities + an effect ===== */
const EFFECTS={
  calm:{txt:'Calm season — no effect.',run:()=>{}},
  love:{txt:'Season of Love — 1 free Piglet per pair of Average/Big pigs (if it fits).',run:(p,i)=>{
    const pairs=Math.floor(p.pigs.filter(x=>x.size==='average'||x.size==='big').length/2);
    let got=0; for(let k=0;k<pairs;k++){ const pg=acquirePig(p,'piglet'); if(pg){got++; markBorn(i,pg);} }
    if(pairs&&!got) log('sys',`${esc(p.name)} had no room for love-piglets.`);
    else if(got) logP(i,`${esc(p.name)} gained ${got} piglet(s) from the Season of Love.`);
  }},
  subsidy:{txt:'Farm subsidy — gain $1 per Piglet you own.',run:(p,i)=>{
    const n=p.pigs.filter(x=>x.size==='piglet').length;
    if(n){p.coins+=n; floatCoin(i,n); logP(i,`${esc(p.name)} got $${n} subsidy.`);}
  }},
  boom:{txt:'Market boom — gain $1 per pig you sold this round.',run:(p,i)=>{
    if(p.soldThisRound){p.coins+=p.soldThisRound; floatCoin(i,p.soldThisRound);
      logP(i,`${esc(p.name)} got $${p.soldThisRound} market bonus.`);}
  }},
  gift:{txt:'Vet visit — each farmer gets 1 free Vaccine.',run:(p,i)=>{p.items.vaccine++;}},
};
function buildDeck(){
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  const deck=[];
  for(let s=0;s<4;s++){
    const pool=s===1?['love','love','calm','subsidy','boom','gift']:['calm','calm','subsidy','boom','gift','love'];
    for(let c=0;c<4;c++){
      deck.push({season:s,
        qty:{feed:6+Math.floor(Math.random()*4),mate:6+Math.floor(Math.random()*4),
             buy:6+Math.floor(Math.random()*4),sell:6+Math.floor(Math.random()*4)},
        effect:pick(pool)});
    }
  }
  return deck;
}

function buyOptions(p){
  return [
    {k:'piglet',label:thumb(PIG_ART.piglet.n)+' Piglet',cost:VAL.piglet,ok:()=>p.coins>=VAL.piglet&&canFitNew(p,'piglet')},
    {k:'small',label:thumb(PIG_ART.small.n,'wide')+' Small pig',cost:VAL.small,ok:()=>p.coins>=VAL.small&&canFitNew(p,'small')},
    {k:'average',label:thumb(PIG_ART.average.n)+' Average pig',cost:VAL.average,ok:()=>p.coins>=VAL.average&&canFitNew(p,'average')},
    {k:'big',label:thumb(PIG_ART.big.n,'wide')+' Big pig',cost:VAL.big,ok:()=>p.coins>=VAL.big&&canFitNew(p,'big')},
    {k:'vaccine',label:thumb(UI_ART.vaccine)+' Vaccine',cost:1,ok:()=>p.coins>=1},
    {k:'supplement',label:thumb(UI_ART.supplement)+' Supplement',cost:1,ok:()=>p.coins>=1},
    {k:'amulet',label:thumb(UI_ART.amulet)+' Amulet of Life',cost:1,ok:()=>p.coins>=1},
    {k:'field',label:'🟩 Field board',cost:fieldPrice(p.fields.length+1),ok:()=>p.coins>=fieldPrice(p.fields.length+1)},
  ];
}
function doBuy(i,k){
  const p=players[i];
  if(k==='field'){ const c=fieldPrice(p.fields.length+1); p.coins-=c; addField(p); floatCoin(i,-c);
    logP(i,`${esc(p.name)} bought field #${p.fields.length} ($${c}).`); return true; }
  if(ITEM_PRICE[k]!==undefined){ p.coins-=ITEM_PRICE[k]; p.items[k]++; floatCoin(i,-ITEM_PRICE[k]);
    logP(i,`${esc(p.name)} bought a ${k} ($${ITEM_PRICE[k]}).`); return true; }
  const pg=acquirePig(p,k);
  if(!pg){ log('sys',`${esc(p.name)} couldn't fit a ${k} — purchase cancelled.`); return false; }
  p.coins-=VAL[k]; floatCoin(i,-VAL[k]); markBorn(i,pg);
  logP(i,`${esc(p.name)} bought a ${k} ($${VAL[k]}).`);
  return true;
}
/* human buy loop: n purchases, Done allowed */
function humanBuys(i,n,title,compensate){
  return new Promise(res=>{
    let left=n;
    const step=()=>{
      if(left<=0){ res(); return; }
      activePanel(i);
      subPrompt(`<b>${esc(players[i].name)}</b> — ${title} (${left} left).`);
      const m=document.getElementById('submenu'); m.innerHTML='';
      buyOptions(players[i]).forEach(o=>{
        const b=document.createElement('button'); b.className='btn it-'+o.k;
        b.innerHTML=`${o.label} <span class="c">$${o.cost}</span>`; b.disabled=!o.ok();
        b.onclick=()=>{ if(doBuy(i,o.k)){ left--; render(); } step(); };
        m.appendChild(b);
      });
      const d=document.createElement('button'); d.className='btn ghost';
      d.textContent=compensate?`Done (+$${left} compensation)`:'Done';
      d.onclick=()=>{ if(compensate&&left>0){players[i].coins+=left;floatCoin(i,left);} clearSub(); res(); };
      m.appendChild(d);
    };
    step();
  });
}

/* ===== AI ===== */
function variedBest(items,score,maxGap=0,chance=.25){
  if(!items.length) return null;
  const ranked=[...items].sort((a,b)=>score(b)-score(a));
  const best=score(ranked[0]);
  const alternatives=ranked.slice(1).filter(x=>best-score(x)<=maxGap);
  if(alternatives.length&&Math.random()<chance)
    return alternatives[Math.floor(Math.random()*alternatives.length)];
  return ranked[0];
}
function aiOpening(i){
  const p=players[i];
  const plan=['small','small','average','vaccine','supplement'];
  for(const k of plan){
    const o=buyOptions(p).find(x=>x.k===k);
    if(o&&o.ok()) doBuy(i,k);
    else { const alt=buyOptions(p).find(x=>x.k==='piglet'&&x.ok()); if(alt) doBuy(i,'piglet'); }
  }
}
function aiPick(i){
  const p=players[i];
  const seasonRound=state.round;             // 1..4 within season
  const finalSeason=state.season===3;
  const growable=p.pigs.filter(x=>canGrow(p,x)&&x.fedRound!==state.roundSerial);
  const mateable=p.pigs.filter(x=>(x.size==='average'||x.size==='big')&&x.matedRound!==state.roundSerial);
  const needVacc=p.pigs.filter(x=>!x.vacc&&VAL[x.size]>=6).length;
  // near season end: secure vaccines for valuable pigs
  if(seasonRound>=3&&needVacc>p.items.vaccine&&p.coins>=needVacc-p.items.vaccine) return 'buy';
  if(p.coins<4&&p.pigs.length>1) return 'sell';
  const options=[];
  if(growable.length) options.push({action:'feed',score:growable.length>=2?3:2});
  if(mateable.length>=2&&canFitNew(p,'piglet')) options.push({action:'mate',score:3});
  if(p.coins>=6&&!finalSeason) options.push({action:'buy',score:2});
  if(p.pigs.length) options.push({action:'sell',score:1});
  return (variedBest(options,x=>x.score)||{action:'buy'}).action;
}
async function aiExecute(i,action,n){
  const p=players[i]; let used=0;
  if(action==='feed'){
    while(used<n){
      const cands=p.pigs.filter(x=>x.fedRound!==state.roundSerial&&canGrow(p,x))
        .sort((a,b)=>VAL[b.size]-VAL[a.size]);
      if(!cands.length) break;
      const pg=variedBest(cands,x=>VAL[NEXT[x.size]]-VAL[x.size],1);
      let steps=1;
      if(p.items.supplement>0&&(pg.size==='piglet'||pg.size==='small')){p.items.supplement--;steps=2;}
      let grown=0; for(let k=0;k<steps;k++){ if(growPig(p,pg)) grown++; }
      pg.fedRound=state.roundSerial; used++;
      render(); const el=pigEl(i,pg.id); if(el)el.classList.add('grew');
      logP(i,`${esc(p.name)} fed a pig${grown===2?' (+supplement)':''} → <b>${pg.size}</b>.`);
      await wait(380);
    }
  } else if(action==='mate'){
    while(used<n){
      const cands=p.pigs.filter(x=>(x.size==='average'||x.size==='big')&&x.matedRound!==state.roundSerial);
      if(cands.length<2) break;
      const first=variedBest(cands,()=>0);
      const second=variedBest(cands.filter(x=>x.id!==first.id),()=>0);
      first.matedRound=second.matedRound=state.roundSerial;
      let bornSize='piglet';
      if(p.items.amulet>0&&canFitNew(p,'small')){p.items.amulet--;bornSize='small';}
      const baby=acquirePig(p,bornSize);
      used++;
      if(baby){ markBorn(i,baby); logP(i,`${esc(p.name)}'s ${first.size} + ${second.size} pair had a <b>${bornSize}</b>${bornSize==='small'?' (amulet)':''}.`); }
      else log('sys',`${esc(p.name)}'s piglet had no room — returned to reserve.`);
      await wait(380);
    }
  } else if(action==='buy'){
    while(used<n){
      const needVacc=p.pigs.filter(x=>!x.vacc&&VAL[x.size]>=6).length;
      let k=null;
      if(needVacc>p.items.vaccine&&p.coins>=1) k='vaccine';
      else if(p.coins>=VAL.small&&canFitNew(p,'small')&&state.season<3) k='small';
      else if(p.coins>=VAL.piglet&&canFitNew(p,'piglet')&&state.season<2) k='piglet';
      else if(!canFitNew(p,'piglet')&&p.coins>=fieldPrice(p.fields.length+1)) k='field';
      else if(p.items.supplement<1&&p.coins>=1&&state.season<3) k='supplement';
      else break;
      if(!doBuy(i,k)) break;
      used++; render(); await wait(320);
    }
  } else if(action==='sell'){
    const target=state.season===3?2:1;
    while(used<n&&used<target){
      const cands=[...p.pigs].sort((a,b)=>VAL[b.size]-VAL[a.size]);
      if(!cands.length) break;
      const pg=variedBest(cands,x=>VAL[x.size],4); if(VAL[pg.size]<6&&p.coins>10) break;
      const el=pigEl(i,pg.id); if(el)el.classList.add('dying'); await wait(400);
      p.pigs=p.pigs.filter(x=>x.id!==pg.id); p.coins+=VAL[pg.size]; p.soldThisRound++;
      floatCoin(i,VAL[pg.size]); render();
      logP(i,`${esc(p.name)} sold a ${pg.size} for <b>$${VAL[pg.size]}</b>.`);
      used++;
    }
  }
  const unused=n-used;
  if(unused>0){ p.coins+=unused; floatCoin(i,unused);
    logP(i,`${esc(p.name)} took $${unused} compensation.`); }
  render();
}
function aiUseVaccines(i){
  const p=players[i];
  const cands=p.pigs.filter(x=>!x.vacc).sort((a,b)=>VAL[b.size]-VAL[a.size]);
  for(const pg of cands){ if(p.items.vaccine<=0) break; p.items.vaccine--; pg.vacc=true; }
}

/* ===== human execute ===== */
function humanFeed(i,n){
  return new Promise(res=>{
    const p=players[i]; let left=n;
    const finish=()=>{ if(left>0){p.coins+=left;floatCoin(i,left);logP(i,`${esc(p.name)} took $${left} compensation.`);} clearSub(); render(); res(); };
    const step=()=>{
      if(left<=0){ finish(); return; }
      render();
      pickOwnPig(i,pg=>pg.fedRound!==state.roundSerial&&canGrow(p,pg),
        `<b>${esc(p.name)}</b> — Feed: pick a pig to grow (${left} left).`,
        pg=>{
          const useSupp=p.items.supplement>0&&(pg.size==='piglet'||pg.size==='small');
          const apply=(supp)=>{
            let steps=supp?2:1; if(supp)p.items.supplement--;
            for(let k=0;k<steps;k++) growPig(p,pg);
            pg.fedRound=state.roundSerial; left--;
            render(); const el=pigEl(i,pg.id); if(el)el.classList.add('grew');
            step();
          };
          if(useSupp){
            subPrompt(`Use a 💊 supplement on this ${pg.size}? (+1 extra step)`);
            const m=document.getElementById('submenu'); m.innerHTML='';
            const y=document.createElement('button'); y.className='btn it-supplement'; y.textContent='Yes, supplement';
            y.onclick=()=>apply(true);
            const nb=document.createElement('button'); nb.className='btn'; nb.textContent='No, just feed';
            nb.onclick=()=>apply(false);
            m.append(y,nb);
          } else apply(false);
        },
        finish,`Done (+$${left})`);
    };
    step();
  });
}
function humanMate(i,n){
  return new Promise(res=>{
    const p=players[i]; let left=n,first=null;
    const eligible=()=>p.pigs.filter(pg=>(pg.size==='average'||pg.size==='big')&&pg.matedRound!==state.roundSerial);
    const finish=()=>{ first=null; if(left>0){p.coins+=left;floatCoin(i,left);logP(i,`${esc(p.name)} took $${left} compensation.`);} clearSub(); render(); res(); };
    const step=()=>{
      if(left<=0){ finish(); return; }
      const available=eligible();
      if((!first&&available.length<2)||(first&&!available.some(pg=>pg.id!==first.id))){ finish(); return; }
      render();
      pickOwnPig(i,pg=>eligible().includes(pg)&&(!first||pg.id!==first.id),
        `<b>${esc(p.name)}</b> — Mate: pick ${first?'the second parent':'the first of 2 parents'} (${left} pair${left===1?'':'s'} left).`,
        pg=>{
          if(!first){ first=pg; step(); return; }
          const parents=[first,pg]; first=null;
          const doIt=(useAmulet)=>{
            parents.forEach(parent=>parent.matedRound=state.roundSerial);
            const size=useAmulet?'small':'piglet';
            if(useAmulet)p.items.amulet--;
            const baby=acquirePig(p,size);
            left--;
            if(baby){markBorn(i,baby);logP(i,`${esc(p.name)}'s ${parents[0].size} + ${parents[1].size} pair had a <b>${size}</b>.`);}
            else log('sys','No room — the newborn was returned to the reserve.');
            step();
          };
          if(p.items.amulet>0&&canFitNew(p,'small')){
            subPrompt('Use a 🧿 Amulet of Life? (newborn is Small instead of Piglet)');
            const m=document.getElementById('submenu'); m.innerHTML='';
            const y=document.createElement('button'); y.className='btn it-amulet'; y.textContent='Yes, amulet';
            y.onclick=()=>doIt(true);
            const nb=document.createElement('button'); nb.className='btn'; nb.textContent='No, plain piglet';
            nb.onclick=()=>doIt(false);
            m.append(y,nb);
          } else doIt(false);
        },
        finish,`Done (+$${left})`);
      if(first){ const el=pigEl(i,first.id); if(el){el.classList.remove('dim');el.classList.add('sel');} }
    };
    step();
  });
}
function humanSell(i,n){
  return new Promise(res=>{
    const p=players[i]; let left=n;
    const finish=()=>{ if(left>0){p.coins+=left;floatCoin(i,left);logP(i,`${esc(p.name)} took $${left} compensation.`);} clearSub(); render(); res(); };
    const step=()=>{
      if(left<=0||!p.pigs.length){ finish(); return; }
      render();
      pickOwnPig(i,()=>true,
        `<b>${esc(p.name)}</b> — Sell: pick a pig (${left} left).`,
        async pg=>{
          const el=pigEl(i,pg.id); if(el)el.classList.add('dying'); await wait(400);
          p.pigs=p.pigs.filter(x=>x.id!==pg.id); p.coins+=VAL[pg.size]; p.soldThisRound++;
          floatCoin(i,VAL[pg.size]); logP(i,`${esc(p.name)} sold a ${pg.size} for <b>$${VAL[pg.size]}</b>.`);
          left--; step();
        },
        finish,`Done (+$${left})`);
    };
    step();
  });
}

/* ===== choice ===== */
function askAction(i){
  return new Promise(res=>{
    activePanel(i);
    subPrompt(`<b>${esc(players[i].name)}</b> — choose your secret action. (Drag your pigs anytime to rearrange.)`);
    clearSub();
    const tiles=document.getElementById('tiles'); tiles.innerHTML='';
    ACTIONS.forEach(a=>{
      const el=document.createElement('div'); el.className='tile k-'+a;
      const d={feed:'grow pigs +1 size',mate:'pair 2 Avg/Big pigs → 1 piglet',buy:'pigs · items · fields',sell:'sell at market price'}[a];
      el.innerHTML=`<img class="atile" draggable="false" src="${UI_ART[a]}"><span class="t">${ANAME[a]}</span><span class="d">${d}</span>`;
      el.onclick=()=>{ clearTiles(); clearSub(); res(a); };
      tiles.appendChild(el);
    });
  });
}

/* ===== reveal + distribute ===== */
function showReveal(choices,allot){
  return new Promise(res=>{
    clearTiles(); clearSub(); clearActive();
    subPrompt('<b>Reveal!</b> Shared actions split from the first player.');
    const m=document.getElementById('submenu');
    let html='<div class="reveal" style="width:100%">';
    choices.forEach((a,i)=>{
      html+=`<div class="rv"><div class="who" style="color:${css(PCOL[i])}">${esc(players[i].name)}</div>
        <div class="card k-${a}" style="animation-delay:${i*0.12}s;border-color:${css(PCOL[i])}"><img class="atile" draggable="false" src="${UI_ART[a]}"><span class="t">${ANAME[a]}</span></div>
        <div class="n">×${allot[i]}</div></div>`;});
    html+='</div>'; m.innerHTML=html;
    setTimeout(()=>{clearSub();res()},1600/(window.__speed||1));
  });
}
function distribute(card,choices){
  const allot=new Array(nP).fill(0);
  ACTIONS.forEach(a=>{
    const group=[];
    for(let k=0;k<nP;k++){ const i=(state.startIdx+k)%nP; if(choices[i]===a) group.push(i); }
    if(!group.length) return;
    let pool=card.qty[a];
    while(pool>0){ let gave=false;
      for(const i of group){ if(pool<=0) break; allot[i]++; pool--; gave=true; }
      if(!gave) break; }
  });
  return allot;
}

/* ===== season change ===== */
function humanVaccineWindow(i){
  return new Promise(res=>{
    const p=players[i];
    const doomed=()=>p.pigs.filter(x=>!x.vacc);
    if(p.items.vaccine<=0||!doomed().length){ res(); return; }
    const o=document.createElement('div'); o.className='overlay';
    const box=document.createElement('div'); box.className='modal'; o.appendChild(box);
    const draw=()=>{
      const d=doomed();
      box.innerHTML=`<div class="big-ico">💉</div>
        <h2>${esc(p.name)} — last chance to vaccinate!</h2>
        <p>Unvaccinated pigs die at the season change. You have <b>${p.items.vaccine}</b> vaccine(s).</p>
        <div style="text-align:left" id="vrows"></div>
        <button class="btn big primary" style="margin-top:14px">Continue</button>`;
      const rows=box.querySelector('#vrows');
      d.sort((a,b)=>VAL[b.size]-VAL[a.size]).forEach(pg=>{
        const row=document.createElement('div'); row.className='vrow';
        row.innerHTML=`<span>🐷 ${pg.size} (worth $${VAL[pg.size]})</span>`;
        const b=document.createElement('button'); b.className='btn it-vaccine'; b.innerHTML=thumb(UI_ART.vaccine)+' Vaccinate';
        b.disabled=p.items.vaccine<=0;
        b.onclick=()=>{ p.items.vaccine--; pg.vacc=true; render(); draw(); };
        row.appendChild(b); rows.appendChild(row);
      });
      box.querySelector('.btn.primary').onclick=()=>{ o.remove(); res(); };
    };
    draw(); document.body.appendChild(o);
  });
}
async function seasonChange(finale){
  const nm=SEASONS[state.season].name;
  log('sys',`— End of ${nm}: unvaccinated pigs won't survive. —`);
  for(let i=0;i<nP;i++){
    if(players[i].human) await humanVaccineWindow(i);
    else aiUseVaccines(i);
  }
  render(); await wait(400);
  for(let i=0;i<nP;i++){
    const p=players[i]; const doomed=p.pigs.filter(x=>!x.vacc);
    doomed.forEach(pg=>{ const el=pigEl(i,pg.id); if(el)el.classList.add('dying'); });
    if(doomed.length){ await wait(650);
      p.pigs=p.pigs.filter(x=>x.vacc);
      log('die',`${esc(p.name)} lost <b>${doomed.length}</b> unvaccinated pig(s) to ${nm}.`); render();
    } else log('sys',`${esc(p.name)} kept every pig. 🛡️`);
  }
  if(!finale){
    state.season++; state.round=1;
    render(); await banner(SEASONS[state.season]);
  }
}
function banner(s){
  return new Promise(res=>{
    const o=document.createElement('div'); o.className='overlay';
    o.innerHTML=`<div class="modal"><div class="big-ico">${s.ico}</div>
      <h2 style="color:${css(s.v)}">${s.name} begins</h2>
      <p>Vaccinated pigs stay vaccinated until sold.</p></div>`;
    document.body.appendChild(o); setTimeout(()=>{o.remove();res()},1500/(window.__speed||1));
  });
}

/* ===== round loop ===== */
async function playRound(){
  state.roundSerial++;
  players.forEach(p=>p.soldThisRound=0);
  const card=deck[(state.season*4)+(state.round-1)];
  state.card=card; showCard(card); render();
  const choices=new Array(nP);
  for(let k=0;k<nP;k++){
    const i=(state.startIdx+k)%nP;
    if(players[i].human){ await passGate(i); choices[i]=await askAction(i); clearActive(); await lockGate(i); }
    else choices[i]=aiPick(i);
  }
  const allot=distribute(card,choices);
  await showReveal(choices,allot);
  for(let k=0;k<nP;k++){
    const i=(state.startIdx+k)%nP; const a=choices[i]; const n=allot[i];
    activePanel(i);
    if(players[i].human){
      if(a==='feed') await humanFeed(i,n);
      else if(a==='mate') await humanMate(i,n);
      else if(a==='sell') await humanSell(i,n);
      else await humanBuys(i,n,'Buy: pick your purchases',true);
    } else await aiExecute(i,a,n);
    clearActive(); await wait(200);
  }
  // seasonal effect
  const eff=EFFECTS[card.effect];
  if(card.effect!=='calm'){ log('sys',`Seasonal effect: ${eff.txt}`);
    for(let i=0;i<nP;i++) eff.run(players[i],i); render(); await wait(500); }
  // advance
  state.round++;
  const lastCardOfSeason=state.round>4;
  if(lastCardOfSeason){
    if(state.season===3){ await seasonChange(true); endGame(); return; }
    await seasonChange(false);
  }
  state.startIdx=(state.startIdx+1)%nP;
  render();
  playRound();
}

/* ===== end ===== */
function endGame(){
  state.round=4; state.season=3;
  const gains=players.map((p,i)=>{ let g=0; p.pigs.forEach(x=>{ if(x.vacc) g+=VAL[x.size]; });
    p.coins+=g; return g; });
  render();
  let ranked=players.map((p,i)=>({p,i,g:gains[i]})).sort((a,b)=>b.p.coins-a.p.coins);
  let tieNote='';
  if(ranked.length>1&&ranked[0].p.coins===ranked[1].p.coins){
    // tie-break: liquidate items + fields
    players.forEach(p=>{ p.tiebreak=p.coins
      +p.items.vaccine+p.items.supplement+p.items.amulet
      +Array.from({length:p.fields.length},(_,n)=>fieldPrice(n+1)).reduce((a,b)=>a+b,0); });
    ranked=players.map((p,i)=>({p,i,g:gains[i]})).sort((a,b)=>(b.p.tiebreak??b.p.coins)-(a.p.tiebreak??a.p.coins));
    tieNote='<p>Tie! Broken by selling items and fields.</p>';
  }
  const top=ranked[0].p.coins; const winners=ranked.filter(r=>r.p.coins===top);
  const title=(tieNote||winners.length===1)?`${esc(ranked[0].p.name)} wins! 🏆`:'Dead heat 🤝';
  let rows='';
  ranked.forEach((r,idx)=>rows+=`<div class="final-row"><span>${idx===0?'👑 ':''}${r.p.human?'🧑‍🌾':'🤖'} ${esc(r.p.name)} — vaccinated herd sold for $${r.g}</span><b>$${r.p.coins}${r.p.tiebreak?` <span style="font-size:11px">(tb $${r.p.tiebreak})</span>`:''}</b></div>`);
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="big-ico">🐷</div>
    <h2 style="color:${css('--good')}">${title}</h2>
    <p>One last winter die-off, then only vaccinated pigs sell.</p>${tieNote}
    <div style="text-align:left;margin:16px 0">${rows}</div>
    <button class="btn big primary" onclick="location.reload()">Play again 🔁</button></div>`;
  document.body.appendChild(o);
  log('sys','Game over — '+ranked.map(r=>esc(r.p.name)+' $'+r.p.coins).join(' · ')+'.');
}

/* ===== setup ===== */
function setup(){
  let count=2;
  const seats=[{name:'You',human:true},{name:'Rival',human:false},{name:'Player 3',human:true}];
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="modal">
    <div class="big-ico">🐷</div>
    <h2>Happy Pigs</h2>
    <p>Pass-and-play for 2–3 farmers, by the official rules. Secret picks — others look away.</p>
    <div class="seatcount" id="seatcount"></div>
    <div id="seatrows"></div>
    <button class="btn big primary" id="startBtn" style="margin-top:16px">Start game 🌾</button>
  </div>`;
  document.body.appendChild(o);
  function drawCount(){
    const sc=o.querySelector('#seatcount'); sc.innerHTML='';
    [2,3].forEach(n=>{const b=document.createElement('button');
      b.className='btn'+(count===n?' primary':''); b.textContent=n+' players';
      b.onclick=()=>{count=n;drawCount();drawSeats()}; sc.appendChild(b);});
  }
  function drawSeats(){
    const sr=o.querySelector('#seatrows'); sr.innerHTML='';
    for(let i=0;i<count;i++){const s=seats[i];
      const row=document.createElement('div'); row.className='seat';
      row.innerHTML=`<span class="dotc" style="background:${css(PCOL[i])}"></span>
        <input value="${s.name}" maxlength="14">
        <div class="seg"><button data-h="1" class="${s.human?'on':''}">Human</button>
        <button data-h="0" class="${s.human?'':'on'}">AI</button></div>`;
      row.querySelector('input').oninput=e=>s.name=e.target.value;
      row.querySelectorAll('.seg button').forEach(bt=>bt.onclick=()=>{s.human=bt.dataset.h==='1';drawSeats()});
      sr.appendChild(row);}
  }
  drawCount(); drawSeats();
  o.querySelector('#startBtn').onclick=()=>{
    nP=count; players=[];
    for(let i=0;i<count;i++) players.push(mkPlayer(seats[i].name.trim()||('Player '+(i+1)),seats[i].human));
    o.remove(); boot();
  };
}

async function boot(){
  deck=buildDeck();
  window.__hp=()=>({players,state});
  buildBoard(); render();
  log('sys',`Happy Pigs — ${nP} farmers, 16 season cards, official rules. First: opening purchases (5 each).`);
  // Before Round One: 5 purchases each, clockwise from first player
  for(let k=0;k<nP;k++){
    const i=(state.startIdx+k)%nP;
    if(players[i].human){ await passGate(i,'Opening market: buy up to 5 things.'); await humanBuys(i,5,'Opening market — buy pigs, items, fields',false); clearActive(); }
    else { aiOpening(i); render(); await wait(400); }
  }
  clearActive(); render();
  playRound();
}

/* ===== drag & drop rearranging (own pigs AND field boards, any time) ===== */
(function(){
  let drag=null; // {kind,i,...,startX,startY,moved,ghost,cand}
  function pastureOf(i){return document.querySelector(`#fields-${i} .pasture`)}
  function killGhost(){ if(drag&&drag.ghost){drag.ghost.remove();drag.ghost=null;} }
  document.addEventListener('pointerdown',e=>{
    if(!(e.target.closest)) return;
    const tile=e.target.closest('.pigtile');
    if(tile){
      const pv=tile.closest('.pasture'); if(!pv) return;
      const i=+pv.dataset.p; if(!players[i]||!players[i].human) return;
      const pg=players[i].pigs.find(x=>x.id===+tile.dataset.id); if(!pg) return;
      drag={kind:'pig',i,pg,el:tile,startX:e.clientX,startY:e.clientY,moved:false,ghost:null,cand:null};
      return;
    }
    const fb=e.target.closest('.fieldboard');
    if(fb){
      const i=+fb.dataset.p; if(!players[i]||!players[i].human) return;
      if(players[i].fields.length<2) return; // one board — nothing to rearrange
      const f=+fb.dataset.f; const b=players[i].fields[f];
      drag={kind:'board',i,f,el:fb,startX:e.clientX,startY:e.clientY,moved:false,ghost:null,cand:null,bx0:b.bx,by0:b.by};
      return;
    }
  });
  function movePig(e){
    drag.cand=null; killGhost();
    const p=players[drag.i], pv=pastureOf(drag.i); if(!pv) return;
    const r=pv.getBoundingClientRect(); const {W,H}=pasture(p); const [w,h]=SPAN[drag.pg.size];
    let x=Math.round((e.clientX-r.left-w*CELL/2)/CELL);
    let y=Math.round((e.clientY-r.top-h*CELL/2)/CELL);
    x=Math.max(0,Math.min(W-w,x)); y=Math.max(0,Math.min(H-h,y));
    const ok=canPlaceAt(p,x,y,drag.pg.size,drag.pg.id);
    const g=document.createElement('div'); g.className='dragghost '+(ok?'ok':'bad');
    g.style.left=(x*CELL)+'px'; g.style.top=(y*CELL)+'px';
    g.style.width=(w*CELL)+'px'; g.style.height=(h*CELL)+'px';
    pv.appendChild(g); drag.ghost=g;
    if(ok) drag.cand={x,y};
  }
  function boardOverlaps(p,f,bx,by){
    for(let j=0;j<p.fields.length;j++){ if(j===f) continue; const b=p.fields[j];
      if(bx<b.bx+FW&&bx+FW>b.bx&&by<b.by+FH&&by+FH>b.by) return true; }
    return false;
  }
  // a moved board must stay flush against another board — no detached, far-flung boards
  // (also bounds the pasture extent, so grid allocations can't blow up)
  function boardTouches(p,f,bx,by){
    for(let j=0;j<p.fields.length;j++){ if(j===f) continue; const b=p.fields[j];
      const vOverlap=by<b.by+FH&&by+FH>b.by, hOverlap=bx<b.bx+FW&&bx+FW>b.bx;
      if(vOverlap&&(bx===b.bx+FW||bx+FW===b.bx)) return true;
      if(hOverlap&&(by===b.by+FH||by+FH===b.by)) return true; }
    return false;
  }
  function moveBoard(e){
    drag.cand=null; killGhost();
    const p=players[drag.i], pv=pastureOf(drag.i); if(!pv) return;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    const nbx=drag.bx0+Math.round(dx/CELL), nby=drag.by0+Math.round(dy/CELL);
    const ok=!boardOverlaps(p,drag.f,nbx,nby)&&boardTouches(p,drag.f,nbx,nby);
    // ghost drawn in the current (normalized) pasture coord space; may overflow — that's fine
    const g=document.createElement('div'); g.className='dragghost boardghost '+(ok?'ok':'bad');
    g.style.left=(nbx*CELL)+'px'; g.style.top=(nby*CELL)+'px';
    g.style.width=(FW*CELL)+'px'; g.style.height=(FH*CELL)+'px';
    pv.appendChild(g); drag.ghost=g;
    if(ok) drag.cand={bx:nbx,by:nby};
  }
  document.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(!drag.moved){ if(Math.hypot(dx,dy)<6) return; drag.moved=true;
      drag.el.classList.add(drag.kind==='pig'?'dragging':'fdrag');
      drag.el.style.pointerEvents='none'; drag.el.style.zIndex=99; }
    drag.el.style.transform=`translate(${dx}px,${dy}px)`;
    if(drag.kind==='pig') movePig(e); else moveBoard(e);
  });
  document.addEventListener('pointerup',()=>{
    if(!drag) return;
    const d=drag; drag=null; killGhost();
    if(d.moved){
      const p=players[d.i];
      if(d.kind==='pig'){
        if(d.cand){ d.pg.x=d.cand.x; d.pg.y=d.cand.y; }
      } else if(d.cand){
        const snap=snapPlay(p);
        p.fields[d.f].bx=d.cand.bx; p.fields[d.f].by=d.cand.by; normalize(p);
        // any pig now off a board? try to repack; if that fails, revert the whole move
        if(p.pigs.some(pg=>!canPlaceAt(p,pg.x,pg.y,pg.size,pg.id))){
          const pos=packAll(p); if(pos) applyPack(p,pos); else restorePlay(p,snap);
        }
      }
      // swallow the click that follows a real drag so pick-handlers don't fire
      const swallow=ev=>{ev.stopPropagation();ev.preventDefault();document.removeEventListener('click',swallow,true);};
      document.addEventListener('click',swallow,true);
      setTimeout(()=>document.removeEventListener('click',swallow,true),80);
      render();
      bindPick(); // re-arm any active pick UI lost to the re-render
    }
  });
})();

/* self-playing demo: #demo3 = 3 AI farmers. For recording; normal play unaffected. */
function autoDemo(){
  const m=location.hash.match(/#demo(\d)?/); const n=Math.min(3,Math.max(2,+(m&&m[1])||3));
  const names=['🐷 Rosie','🐖 Hamlet','🐽 Truffle'];
  nP=n; players=[];
  for(let i=0;i<n;i++) players.push(mkPlayer(names[i],false));
  window.__speed=window.__speed||2;
  boot();
}
if(location.hash.indexOf('demo')>=0) autoDemo(); else setup();
